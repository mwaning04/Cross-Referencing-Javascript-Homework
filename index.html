<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross Referencing Data Homework</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div>
        <div id="attackingGroupContainer">
            <h1>Attacking Type</h1>
            <select name="attackingGroup" id="attackingGroup">
                <option value="fire">Fire</option>
                <option value="water">Water</option>
                <option value="electric">Electric</option>
                <option value="grass">Grass</option>
            </select>
        </div>
        <div id="defendingGroupContainer">
            <h1>Defending Type</h1>
            <select name="defendingGroup" id="defendingGroup">
                <option value="fire">Fire</option>
                <option value="water">Water</option>
                <option value="electric">Electric</option>
                <option value="grass">Grass</option>
            </select>
        </div>
    </div>
    <button id="calculateBtn">Calculate Type Matchup</button>
    <p id="result"></p>

    <script src="app/app.js"></script>
</body>
</html>
